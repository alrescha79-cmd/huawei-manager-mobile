name: Test Push Notification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Send mode'
        required: true
        default: 'topic'
        type: choice
        options:
          - topic
          - single-device
      expo_push_token:
        description: 'Expo Push Token (only for single-device mode)'
        required: false
      title:
        description: 'Notification title'
        required: false
        default: 'Test Notification'
      body:
        description: 'Notification body'
        required: false
        default: 'Push notification test from GitHub Actions'
      channel_id:
        description: 'Android channel ID'
        required: false
        default: 'app-updates'
        type: choice
        options:
          - app-updates
          - usage-alerts
          - ip-change

jobs:
  send-topic:
    if: ${{ github.event.inputs.mode == 'topic' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send topic broadcast via FCM HTTP v1 API
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TITLE: ${{ github.event.inputs.title }}
          BODY: ${{ github.event.inputs.body }}
          CHANNEL: ${{ github.event.inputs.channel_id }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set"
            exit 1
          fi

          node << 'EOF'
          const crypto = require('crypto');
          const https = require('https');

          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT.trim());
          const { client_email, private_key, project_id } = sa;

          console.log(`Project: ${project_id}`);
          console.log(`Service account: ${client_email}`);

          // Build JWT (RS256)
          const now = Math.floor(Date.now() / 1000);
          const header = Buffer.from(JSON.stringify({ alg: 'RS256', typ: 'JWT' })).toString('base64url');
          const payload = Buffer.from(JSON.stringify({
            iss: client_email,
            scope: 'https://www.googleapis.com/auth/firebase.messaging',
            aud: 'https://oauth2.googleapis.com/token',
            iat: now,
            exp: now + 3600,
          })).toString('base64url');
          const unsigned = header + '.' + payload;

          const sign = crypto.createSign('RSA-SHA256').update(unsigned).sign(private_key);
          const signature = sign.toString('base64url');
          const jwt = unsigned + '.' + signature;

          function httpsRequest(url, options, body) {
            return new Promise((resolve, reject) => {
              const u = new URL(url);
              const req = https.request({
                hostname: u.hostname,
                path: u.pathname + u.search,
                method: 'POST',
                headers: Object.assign({ 'Content-Length': Buffer.byteLength(body) }, options.headers || {}),
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => resolve({ status: res.statusCode, body: data }));
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          (async () => {
            // Exchange JWT for access token
            const tokenRes = await httpsRequest('https://oauth2.googleapis.com/token', {
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            }, 'grant_type=' + encodeURIComponent('urn:ietf:params:oauth:grant-type:jwt-bearer') + '&assertion=' + jwt);

            if (tokenRes.status !== 200) {
              console.error('Token exchange failed (HTTP ' + tokenRes.status + '):', tokenRes.body);
              process.exit(1);
            }

            const accessToken = JSON.parse(tokenRes.body).access_token;
            console.log('Access token obtained: ' + accessToken.substring(0, 20) + '...');

            // Build FCM payload
            const fcmPayload = JSON.stringify({
              message: {
                topic: 'all_users',
                notification: { title: process.env.TITLE, body: process.env.BODY },
                android: { priority: 'high', notification: { channelId: process.env.CHANNEL, sound: 'default' } },
                data: { route: '/(tabs)/home', type: 'test-notification' },
              },
            });

            // Send FCM HTTP v1
            const fcmRes = await httpsRequest(
              'https://fcm.googleapis.com/v1/projects/' + project_id + '/messages:send',
              { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + accessToken } },
              fcmPayload);

            console.log('\nResponse (HTTP ' + fcmRes.status + '):');
            try { console.log(JSON.stringify(JSON.parse(fcmRes.body), null, 2)); } catch(e) { console.log(fcmRes.body); }

            if (fcmRes.status !== 200) {
              console.error('FCM HTTP v1 failed');
              process.exit(1);
            }

            console.log('FCM message sent successfully via HTTP v1 API');
          })().catch(e => { console.error(e); process.exit(1); });
          EOF

  send-single:
    if: ${{ github.event.inputs.mode == 'single-device' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send push to single device via Expo API
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set"
            exit 1
          fi

          TARGET="${{ github.event.inputs.expo_push_token }}"
          if [ -z "$TARGET" ]; then
            echo "::error::expo_push_token is required for single-device mode"
            exit 1
          fi

          TITLE="${{ github.event.inputs.title }}"
          BODY="${{ github.event.inputs.body }}"
          CHANNEL="${{ github.event.inputs.channel_id }}"

          echo "Sending to: ${TARGET:0:30}..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://exp.host/--/api/v2/push/send" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -d "{
              \"to\": \"$TARGET\",
              \"title\": \"$TITLE\",
              \"body\": \"$BODY\",
              \"sound\": \"default\",
              \"channelId\": \"$CHANNEL\",
              \"data\": {
                \"route\": \"/(tabs)/home\",
                \"type\": \"test-notification\"
              }
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESP_BODY=$(echo "$RESPONSE" | sed '$d')

          echo ""
          echo "Response (HTTP $HTTP_CODE):"
          echo "$RESP_BODY" | jq . 2>/dev/null || echo "$RESP_BODY"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Expo API returned HTTP $HTTP_CODE"
            exit 1
          fi

          STATUS=$(echo "$RESP_BODY" | jq -r '.data.status // "unknown"')
          if [ "$STATUS" = "error" ]; then
            ERROR_MSG=$(echo "$RESP_BODY" | jq -r '.data.message // "unknown error"')
            echo "::error::Push failed: $ERROR_MSG"
            exit 1
          fi

          TICKET=$(echo "$RESP_BODY" | jq -r '.data.id // "unknown"')
          echo ""
          echo "Notification sent!"
          echo "  Ticket ID: $TICKET"
