name: Test Push Notification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Send mode'
        required: true
        default: 'topic'
        type: choice
        options:
          - topic
          - single-device
      expo_push_token:
        description: 'Expo Push Token (only for single-device mode)'
        required: false
      title:
        description: 'Notification title'
        required: false
        default: 'Test Notification'
      body:
        description: 'Notification body'
        required: false
        default: 'Push notification test from GitHub Actions'
      channel_id:
        description: 'Android channel ID'
        required: false
        default: 'app-updates'
        type: choice
        options:
          - app-updates
          - usage-alerts
          - ip-change

jobs:
  send-topic:
    if: ${{ github.event.inputs.mode == 'topic' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        run: npm install firebase-admin@latest

      - name: Send topic broadcast via Firebase Admin
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TITLE: ${{ github.event.inputs.title }}
          BODY: ${{ github.event.inputs.body }}
          CHANNEL: ${{ github.event.inputs.channel_id }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set"
            exit 1
          fi

          cat > send-topic.js << 'NODESCRIPT'
          const { initializeApp, cert } = require('firebase-admin/app');
          const { getMessaging } = require('firebase-admin/messaging');

          let sa;
          try {
            sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT.trim());
          } catch (e) {
            console.error('Failed to parse FIREBASE_SERVICE_ACCOUNT:', e.message);
            process.exit(1);
          }
          initializeApp({ credential: cert(sa) });

          const title = process.env.TITLE;
          const body = process.env.BODY;
          const channel = process.env.CHANNEL;

          const message = {
            topic: 'all_users',
            notification: { title, body },
            android: {
              priority: 'high',
              notification: { channelId: channel, sound: 'default' },
            },
            data: {
              route: '/(tabs)/home',
              type: 'test-notification',
            },
          };

          getMessaging().send(message)
            .then(id => { console.log('FCM message sent, id:', id); })
            .catch(err => { console.error('FCM send failed:', err.message); process.exit(1); });
          NODESCRIPT

          node send-topic.js

  send-single:
    if: ${{ github.event.inputs.mode == 'single-device' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send push to single device via Expo API
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set"
            exit 1
          fi

          TARGET="${{ github.event.inputs.expo_push_token }}"
          if [ -z "$TARGET" ]; then
            echo "::error::expo_push_token is required for single-device mode"
            exit 1
          fi

          TITLE="${{ github.event.inputs.title }}"
          BODY="${{ github.event.inputs.body }}"
          CHANNEL="${{ github.event.inputs.channel_id }}"

          echo "Sending to: ${TARGET:0:30}..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://exp.host/--/api/v2/push/send" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -d "{
              \"to\": \"$TARGET\",
              \"title\": \"$TITLE\",
              \"body\": \"$BODY\",
              \"sound\": \"default\",
              \"channelId\": \"$CHANNEL\",
              \"data\": {
                \"route\": \"/(tabs)/home\",
                \"type\": \"test-notification\"
              }
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESP_BODY=$(echo "$RESPONSE" | sed '$d')

          echo ""
          echo "Response (HTTP $HTTP_CODE):"
          echo "$RESP_BODY" | jq . 2>/dev/null || echo "$RESP_BODY"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Expo API returned HTTP $HTTP_CODE"
            exit 1
          fi

          STATUS=$(echo "$RESP_BODY" | jq -r '.data.status // "unknown"')
          if [ "$STATUS" = "error" ]; then
            ERROR_MSG=$(echo "$RESP_BODY" | jq -r '.data.message // "unknown error"')
            echo "::error::Push failed: $ERROR_MSG"
            exit 1
          fi

          TICKET=$(echo "$RESP_BODY" | jq -r '.data.id // "unknown"')
          echo ""
          echo "Notification sent!"
          echo "  Ticket ID: $TICKET"
