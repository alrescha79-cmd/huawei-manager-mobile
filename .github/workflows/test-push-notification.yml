name: Test Push Notification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Send mode'
        required: true
        default: 'topic'
        type: choice
        options:
          - topic
          - single-device
      expo_push_token:
        description: 'Expo Push Token (only for single-device mode)'
        required: false
      title:
        description: 'Notification title'
        required: false
        default: 'Test Notification'
      body:
        description: 'Notification body'
        required: false
        default: 'Push notification test from GitHub Actions'
      channel_id:
        description: 'Android channel ID'
        required: false
        default: 'app-updates'
        type: choice
        options:
          - app-updates
          - usage-alerts
          - ip-change

jobs:
  send-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send push notification
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set in GitHub repository secrets"
            exit 1
          fi

          # Read projectId from app.config.ts
          PROJECT_ID=$(grep -oP "projectId:\s*\'\K[^']+" app.config.ts)
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Could not read projectId from app.config.ts"
            exit 1
          fi
          echo "Expo Project ID: $PROJECT_ID"

          MODE="${{ github.event.inputs.mode }}"
          TITLE="${{ github.event.inputs.title }}"
          BODY="${{ github.event.inputs.body }}"
          CHANNEL="${{ github.event.inputs.channel_id }}"

          if [ "$MODE" = "topic" ]; then
            echo "Sending topic broadcast to @${PROJECT_ID}/all_users..."
            TARGET="@${PROJECT_ID}/all_users"
          else
            TOKEN="${{ github.event.inputs.expo_push_token }}"
            if [ -z "$TOKEN" ]; then
              echo "::error::expo_push_token is required for single-device mode"
              exit 1
            fi
            echo "Sending to single device: ${TOKEN:0:30}..."
            TARGET="$TOKEN"
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://exp.host/--/api/v2/push/send" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -d "{
              \"to\": \"$TARGET\",
              \"title\": \"$TITLE\",
              \"body\": \"$BODY\",
              \"sound\": \"default\",
              \"channelId\": \"$CHANNEL\",
              \"data\": {
                \"route\": \"/(tabs)/home\",
                \"type\": \"test-notification\",
                \"source\": \"github-actions-test\"
              }
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESP_BODY=$(echo "$RESPONSE" | sed '$d')

          echo ""
          echo "Response (HTTP $HTTP_CODE):"
          echo "$RESP_BODY" | jq . 2>/dev/null || echo "$RESP_BODY"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Expo API returned HTTP $HTTP_CODE"
            exit 1
          fi

          if echo "$RESP_BODY" | jq -e '.data[0].status' 2>/dev/null | grep -q "error"; then
            ERROR_MSG=$(echo "$RESP_BODY" | jq -r '.data[0].message')
            echo "::error::Push failed: $ERROR_MSG"
            exit 1
          fi

          TICKET=$(echo "$RESP_BODY" | jq -r '.data[0].id // "unknown"')
          echo ""
          echo "Notification sent!"
          echo "  Ticket ID: $TICKET"
          echo "  Mode: $MODE"
          echo "  Target: $TARGET"
